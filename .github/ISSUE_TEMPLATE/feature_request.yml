name: Feature request
description: Propose a considered improvement to InsightOS.
title: "feature: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Describe the user problem first. A proposed solution is helpful, but it is not a substitute for understanding the need."
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is difficult, missing, or unnecessarily complex?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour or experience you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have considered.
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: How would this improve clarity, productivity, accessibility, or reliability?
